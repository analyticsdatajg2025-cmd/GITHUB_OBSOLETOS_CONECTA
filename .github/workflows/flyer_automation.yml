name: Generar Flyers Automaticamente

on:
  schedule:
    # 20:00 UTC es 15:00 (3 PM) hora Perú
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

# Evita que dos ejecuciones (p. ej. push + programada) se pisen al escribir el Sheet y publicar Pages
concurrency:
  group: flyers-obsoletos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write # necesario para el paso "Mantener workflow activo"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias
        # Versiones fijas para que una actualización de pandas/Pillow no rompa el proceso
        run: pip install -r requirements.txt

      - name: Bajar caché de imágenes
        # ZIP con las imágenes que se descargan desde la red de la empresa con
        # herramientas/actualizar_imagenes.bat (lacuracao.pe bloquea las descargas desde GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p imagenes_cache
          if gh release download imagenes-cache --pattern imagenes_cache.zip --repo "${{ github.repository }}" --clobber; then
            unzip -q -o imagenes_cache.zip -d imagenes_cache
            echo "Caché de imágenes: $(ls imagenes_cache | wc -l) archivos"
          else
            echo "Aún no hay caché de imágenes (release 'imagenes-cache'). Se intentará descargar cada imagen."
          fi

      - name: Ejecutar Script de Flyers
        id: script
        env:
          GOOGLE_SHEETS_JSON: ${{ secrets.GOOGLE_SHEETS_JSON }}
          PYTHONUNBUFFERED: 1
        run: python generar_flyers.py

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Desplegar
        uses: actions/deploy-pages@v4

      - name: Publicar resumen para MKT SISTEMA
        # Solo informa: el monitor «Lento y Obsoletos» de MKT SISTEMA lee este JSON del release
        # «resumenes». Corre siempre y nunca hace fallar el job.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMEN_PROCESO: obsoletos
          RESUMEN_BLOQUE: '0'
        run: |
          python3 resumen.py cerrar "${{ steps.script.outcome }}"
          R="${{ github.repository }}"
          gh release view resumenes --repo "$R" >/dev/null 2>&1 || \
            gh release create resumenes --repo "$R" --title "Resumenes de ejecucion (no borrar)" --latest=false \
              --notes "Un JSON por ejecucion con el resumen que lee MKT SISTEMA. Se limpian solos a los 5 dias." || true
          ARCH="obsoletos_${GITHUB_RUN_ID}_0.json"
          cp resumen.json "$ARCH"
          for i in 1 2 3; do gh release upload resumenes "$ARCH" --clobber --repo "$R" && break; sleep 5; done
          # Los de más de 5 días ya los guardó MKT SISTEMA (los conserva 30 días)
          LIMITE=$(date -u -d '5 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$R/releases/tags/resumenes" --jq ".assets[] | select(.updated_at < \"$LIMITE\") | .id" | \
            while read -r id; do gh api -X DELETE "repos/$R/releases/assets/$id" || true; done

      - name: Mantener workflow activo
        # GitHub desactiva los workflows programados tras 60 días sin commits.
        # Re-habilitarlo en cada ejecución reinicia ese contador.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable flyer_automation.yml --repo "${{ github.repository }}"
